

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VOLORA LOGIN</title>

    <link rel="stylesheet" href="a.css">
</head>

<body>

    <form id="myform">

        <div class="div1">

            <h1 class="h1">VOLORA</h1>

            <div class="c">

                <label for="Username" class="cc">Username:</label>

                <input id="Username" type="text" name="Username">

                <span class="error" id="Username Error" style="color:red; font-size:15px;"></span>

            </div>

            <div class="d">

                <label for="Password" class="cc">Password:</label>

                <input id="Password" type="password" name="Password">

                <span class="Error" id="Password Error" style="color:red; font-size:15px;"></span>

            </div>

            <div class="btn-group">

                <button class="btn1" type="button" id="submitBtn">
                    submit
                </button>

                <button class="btn2" type="reset" id="btn2">
                    Reset
                </button>

            </div>

        </div>

    </form>

    <script>

        const submitBtn = document.getElementById("submitBtn");

        const resetBtn = document.getElementById("btn2");

        const usernameInput = document.getElementById("Username");

        const passwordInput = document.getElementById("Password");

        const usernameError = document.getElementById("Username Error");

        const passwordError = document.getElementById("Password Error");


        submitBtn.addEventListener("click", function() {

            let username = usernameInput.value.trim();

            let password = passwordInput.value.trim();

            usernameError.innerText = "";

            passwordError.innerText = "";

            let hasError = false;


            if (username === "") {

                usernameError.innerText = "لطفا نام کاربری را وارد کنید";

                hasError = true;

            }


            if (password === "") {

                passwordError.innerText = "لطفا رمز عبور را وارد کنید";

                hasError = true;

            }


            if (hasError === false) {

                window.location.href = "https://mahes8681.github.io/VELORA/";

            }

        });


        resetBtn.addEventListener("click", function() {

            usernameError.innerText = "";

            passwordError.innerText = "";

        });

    </script>

</body>

</html>
